services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wbl
      POSTGRES_USER: wbl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  mail:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
